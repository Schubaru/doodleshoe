<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>368 DINOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="reset-button" id="resetButton" aria-label="Restart game" title="Restart game">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8" stroke="currentColor" stroke-width="3" stroke-linecap="square"/>
            <path d="M21 3v5h-5" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16" stroke="currentColor" stroke-width="3" stroke-linecap="square"/>
            <path d="M3 21v-5h5" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
    </button>

    <div class="game-container">
        <h1>368 DINOS</h1>
        <div class="rescue-counter" aria-live="polite">RESCUED: <span id="rescuedCount">0</span>/368</div>
        
        <div class="game-board" id="gameBoard" role="grid" aria-label="Game board">
            <!-- Grid cells will be generated by JavaScript -->
        </div>

        <div id="currentPair" class="current-pair" role="button" tabindex="0" aria-pressed="false" aria-label="Current dinosaur pair. Drag onto the board, or tap to arm placement mode.">
            <div class="preview-dinos">
                <div class="preview-cell" role="img" aria-label="First dinosaur"></div>
                <div class="preview-cell" role="img" aria-label="Second dinosaur"></div>
            </div>
        </div>
        <p id="pairHint" class="pair-hint">Drag onto the board, or tap to place</p>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
        <div class="modal-content">
            <h2 id="gameOverTitle">EXTINCTION EVENT</h2>
            <div class="final-stats">
                <div>Dinosaurs Rescued: <span id="finalRescued">0</span></div>
            </div>
            <button id="restartButton" class="restart-button">PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js?v=3"></script>
</body>
</html>
